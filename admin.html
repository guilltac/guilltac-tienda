<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>GUILLTAC - Administración</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#222;
}

.admin-header{
    background:#151515;
    color:white;
    padding:20px;
    text-align:center;
}

.admin-header h1{
    margin:0;
    font-size:25px;
}

.admin-header p{
    margin:7px 0 0;
    color:#bbb;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );
    gap:20px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 5px 15px
        rgba(0,0,0,.15);
}

.card-icon{
    font-size:38px;
    margin-bottom:12px;
}

.card h2{
    margin:5px 0;
    font-size:19px;
}

.card p{
    color:#666;
    font-size:14px;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:12px 20px;
    background:#222;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

</style>

</head>


<body>


<header class="admin-header">

<h1>GUILLTAC</h1>

<p>Panel de administración</p>

</header>


<main class="container">

<h2>Administración de la tienda</h2>

<div class="dashboard">


<div class="card">

<div class="card-icon">
📦
</div>

<h2>Productos</h2>

<p>
Agregar, editar y eliminar productos
</p>

</div>


<div class="card">

<div class="card-icon">
🏷️
</div>

<h2>Categorías</h2>

<p>
Crear y administrar categorías
</p>

</div>


<div class="card">

<div class="card-icon">
📊
</div>

<h2>Inventario</h2>

<p>
Controlar existencias y stock
</p>

</div>


<div class="card">

<div class="card-icon">
🔥
</div>

<h2>Promociones</h2>

<p>
Administrar productos en promoción
</p>

</div>


</div>


<a
href="index.html"
class="back"
>
← Volver a la tienda
</a>


</main>


</body>

</html>
