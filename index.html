<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GUILLTAC | Equipo Táctico Bolivia</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#222;
}

button{
    font-family:inherit;
}

/* =========================
   HEADER
========================= */

header{
    background:
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(0,0,0,.72)
        ),
        linear-gradient(
            135deg,
            #172017,
            #111,
            #283126
        );

    color:white;
    padding:22px 30px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);
}

.header-content{
    max-width:1400px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:48px;
    height:48px;

    border:2px solid white;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:bold;

    transform:rotate(-8deg);
}

.logo-area h1{
    font-size:30px;
    letter-spacing:3px;
    line-height:1;
}

.logo-area p{
    font-size:11px;
    color:#ccc;
    margin-top:7px;
    letter-spacing:1px;
}

.cart-button{
    background:#fff;
    color:#111;

    border:none;
    padding:11px 18px;

    border-radius:6px;

    font-weight:bold;
    cursor:pointer;
}

.cart-button:hover{
    background:#ddd;
}

/* =========================
   CONTENEDOR PRINCIPAL
========================= */

.container{
    max-width:1400px;
    margin:25px auto;

    display:grid;

    grid-template-columns:
        220px
        1fr;

    gap:25px;

    padding:0 20px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    background:white;

    border-radius:10px;

    padding:18px;

    height:max-content;

    position:sticky;
    top:110px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);
}

.sidebar h2{
    font-size:18px;
    margin-bottom:15px;

    border-bottom:1px solid #ddd;

    padding-bottom:12px;
}

.categories{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.category{
    background:white;

    padding:10px;

    display:flex;
    align-items:center;

    gap:12px;

    border-radius:7px;

    cursor:pointer;

    border:1px solid #ddd;

    transition:.2s;
}

.category:hover{
    background:#f1f1f1;
    transform:translateX(3px);
}

.category.active{
    background:#222;
    color:white;
}

.category-icon{
    width:42px;
    height:42px;

    min-width:42px;

    border:2px solid currentColor;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:bold;
}

.category h3{
    font-size:14px;
}

/* =========================
   PRODUCTOS
========================= */

.products-area{
    min-width:0;
}

.products-header{
    background:white;

    padding:18px 20px;

    border-radius:10px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
        0 2px 10px rgba(0,0,0,.06);
}

.products-header h2{
    font-size:22px;
}

#contador{
    color:#777;
    font-size:14px;
}

/* =========================
   GRID
========================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap:20px;
}

/* =========================
   PRODUCT CARD
========================= */

.product{
    background:white;

    border-radius:10px;

    overflow:hidden;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);

    transition:.2s;
}

.product:hover{
    transform:translateY(-4px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.15);
}

.product-image{
    height:180px;

    background:
        linear-gradient(
            135deg,
            #222,
            #3b443b
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:50px;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.product-info{
    padding:16px;
}

.product-info h3{
    font-size:17px;

    margin-bottom:8px;
}

.product-description{
    font-size:13px;

    color:#666;

    min-height:38px;

    margin-bottom:12px;
}

.price{
    font-size:20px;

    font-weight:bold;

    margin-bottom:8px;
}

.stock{
    font-size:12px;

    color:#777;

    margin-bottom:12px;
}

.product-buttons{
    display:flex;

    gap:8px;
}

.product-buttons button{
    flex:1;

    border:none;

    padding:10px 5px;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;
}

.btn-cart{
    background:#222;
    color:white;
}

.btn-whatsapp{
    background:#25D366;
    color:white;
}

.product-buttons button:hover{
    opacity:.85;
}

/* =========================
   CARGANDO
========================= */

.loading{
    background:white;

    padding:40px;

    border-radius:10px;

    text-align:center;

    color:#666;
}

/* =========================
   MODALES
========================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.65);

    z-index:2000;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal-content{
    background:white;

    width:100%;
    max-width:600px;

    max-height:90vh;

    overflow:auto;

    border-radius:10px;

    padding:25px;
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.close{
    border:none;

    background:none;

    font-size:28px;

    cursor:pointer;
}

/* =========================
   CARRITO
========================= */

.cart-item{
    border-bottom:1px solid #ddd;

    padding:12px 0;

    display:flex;

    justify-content:space-between;

    gap:10px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info strong{
    display:block;

    margin-bottom:4px;
}

.cart-controls{
    display:flex;

    align-items:center;

    gap:7px;
}

.cart-controls button{
    width:28px;
    height:28px;

    border:none;

    background:#222;

    color:white;

    border-radius:4px;

    cursor:pointer;
}

.cart-total{
    font-size:20px;

    font-weight:bold;

    text-align:right;

    margin-top:20px;
}

.checkout-button{
    width:100%;

    background:#25D366;

    color:white;

    border:none;

    padding:14px;

    border-radius:6px;

    margin-top:15px;

    font-weight:bold;

    cursor:pointer;
}

/* =========================
   FORMULARIO
========================= */

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    font-weight:bold;

    font-size:14px;

    margin-bottom:5px;
}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:11px;

    border:1px solid #ccc;

    border-radius:5px;

    font-size:14px;
}

.form-group textarea{
    min-height:80px;

    resize:vertical;
}

/* =========================
   CATEGORIAS MOVILES
========================= */

@media(max-width:800px){

    .container{

        grid-template-columns:1fr;

    }

    .sidebar{

        position:relative;

        top:auto;
    }

    .categories{

        flex-direction:row;

        overflow-x:auto;

        padding-bottom:5px;
    }

    .category{

        min-width:125px;

        flex-direction:column;

        justify-content:center;

        text-align:center;

        gap:6px;
    }

    .category:hover{
        transform:none;
    }

}

/* =========================
   CELULARES
========================= */

@media(max-width:500px){

    header{
        padding:16px;
    }

    .logo-area h1{
        font-size:22px;
    }

    .logo-area p{
        font-size:11px;
    }

    .cart-button{
        padding:9px 12px;
        font-size:12px;
    }

    .container{
        padding:0 10px;
        margin-top:15px;
    }

    .products{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .product-image{
        height:130px;
    }

    .product-info{
        padding:10px;
    }

    .product-info h3{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

    .product-buttons{
        flex-direction:column;
    }

}

/* =========================
   OCULTO
========================= */

.hidden{
    display:none !important;
}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-content">

<div class="logo-area">

<div class="brand-mark">

<div>
<h1>GUILLTAC</h1>

EQUIPAMIENTO TÁCTICO · APH · PROFESIONAL

class="cart-button"
onclick="abrirCarrito()">

🛒 Carrito
<span id="cart-count">0</span>

<!-- =========================

<div class="container">


<!-- =========================

<aside class="sidebar">

class="category active"
onclick="filtrarCategoria('todos',this)">

class="category"
onclick="filtrarCategoria('novedades',this)">

<div
class="category"

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbzSN6dszANppWHxfySG_QEjW8n57qFFeBwcAfaW7tI2WeZPWArCGBqhWQp-mUv0EwU-uQ/exec";


const WHATSAPP =
"59173272204";


let productos = [];

let carrito = [];


/* =========================
   CARGAR PRODUCTOS
========================= */

function cargarProductos(){

    const script =
        document.createElement("script");

    script.src =
        URL_SERVIDOR +
        "?callback=recibirProductos&t=" +
        Date.now();

    script.onerror =
        function(){

            document.getElementById(
                "productos"
            ).innerHTML =

            `<div class="loading">
                No se pudieron cargar
                los productos.
            </div>`;

        };

    document.body.appendChild(script);

}


/* =========================
   RECIBIR PRODUCTOS
========================= */

function recibirProductos(datos){

    productos = datos || [];

    mostrarProductos(productos);

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(lista){

    const contenedor =
        document.getElementById(
            "productos"
        );

    contenedor.innerHTML = "";

    document.getElementById(
        "contador"
    ).textContent =
        lista.length +
        " producto(s)";


    if(lista.length === 0){

        contenedor.innerHTML =

        `<div class="loading">
            No hay productos disponibles.
        </div>`;

        return;

    }


    lista.forEach(producto => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className =
            "product";


        tarjeta.dataset.category =
            producto.categorias || "";


        let precio =
            parseFloat(producto.precio);


        let precioTexto =
            isNaN(precio)
            ? "Consultar"
            : "Bs " +
              precio.toFixed(2);


        let stock =
            parseInt(producto.stock);


        let estado =
            String(
                producto.estado || ""
            ).toLowerCase();


        let agotado =
            estado === "agotado" ||
            stock <= 0;


        let imagen = "";

        if(producto.foto){

            imagen =
            `<img
                src="${producto.foto}"
                alt="${producto.nombre}">
            `;

        }else{

            imagen =
            `<span>◈</span>`;

        }


        tarjeta.innerHTML = `

            <div class="product-image">

                ${imagen}

            </div>


            <div class="product-info">

                <h3>
                    ${producto.nombre || ""}
                </h3>


                <div class="product-description">

                    ${producto.descripcion || ""}

                </div>


                <div class="price">

                    ${precioTexto}

                </div>


                <div class="stock">

                    ${
                        agotado
                        ? "Agotado"
                        : "Stock: " +
                          (isNaN(stock)
                          ? 0
                          : stock)
                    }

                </div>


                <div class="product-buttons">


                    <button
                    class="btn-cart"
                    ${
                        agotado
                        ? "disabled"
                        : ""
                    }
                    onclick="agregarCarrito('${producto.id}')">

                        ${
                            agotado
                            ? "Agotado"
                            : "🛒 Agregar"
                        }

                    </button>


                    <button
                    class="btn-whatsapp"
                    onclick="consultarProducto('${producto.id}')">

                        WhatsApp

                    </button>


                </div>

            </div>

        `;


        contenedor.appendChild(
            tarjeta
        );

    });

}


/* =========================
   FILTRAR CATEGORÍA
========================= */

function filtrarCategoria(
    categoria,
    boton
){

    document
    .querySelectorAll(
        ".category"
    )
    .forEach(elemento => {

        elemento.classList.remove(
            "active"
        );

    });


    if(boton){

        boton.classList.add(
            "active"
        );

    }


    const tarjetas =
        document.querySelectorAll(
            ".product"
        );


    let visibles = 0;


    tarjetas.forEach(
        tarjeta => {

            const categorias =
                String(
                    tarjeta.dataset.category
                    || ""
                )
                .toLowerCase()
                .split(
                    /[,\s]+/
                )
                .filter(Boolean);


            if(
                categoria === "todos"
                ||
                categorias.includes(
                    categoria
                )
            ){

                tarjeta.classList.remove(
                    "hidden"
                );

                visibles++;

            }else{

                tarjeta.classList.add(
                    "hidden"
                );

            }

        }
    );


    document.getElementById(
        "contador"
    ).textContent =
        visibles +
        " producto(s)";


}


/* =========================
   AGREGAR AL CARRITO
========================= */

function agregarCarrito(id){

    const producto =
        productos.find(
            p =>
            String(p.id) ===
            String(id)
        );


    if(!producto){

        return;

    }


    const existente =
        carrito.find(
            p =>
            String(p.id) ===
            String(id)
        );


    if(existente){

        existente.cantidad++;

    }else{

        carrito.push({

            ...producto,

            cantidad:1

        });

    }


    actualizarCarrito();

}


/* =========================
   ACTUALIZAR CARRITO
========================= */

function actualizarCarrito(){

    const contador =
        carrito.reduce(
            (total,p) =>
            total + p.cantidad,
            0
        );


    document.getElementById(
        "cart-count"
    ).textContent =
        contador;


    mostrarCarrito();

}


/* =========================
   MOSTRAR CARRITO
========================= */

function mostrarCarrito(){

    const contenedor =
        document.getElementById(
            "carritoItems"
        );


    contenedor.innerHTML = "";


    if(carrito.length === 0){

        contenedor.innerHTML =
        "<p>El carrito está vacío.</p>";

        document.getElementById(
            "carritoTotal"
        ).textContent =
        "Total: Bs 0";

        return;

    }


    let total = 0;


    carrito.forEach(
        (producto,index) => {

            const precio =
                parseFloat(
                    producto.precio
                ) || 0;


            total +=
                precio *
                producto.cantidad;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "cart-item";


            item.innerHTML = `

                <div class="cart-item-info">

                    <strong>
                        ${producto.nombre}
                    </strong>

                    Bs ${precio.toFixed(2)}

                </div>


                <div class="cart-controls">

                    <button
                    onclick="cambiarCantidad(${index},-1)">
                        -
                    </button>

                    <span>
                        ${producto.cantidad}
                    </span>

                    <button
                    onclick="cambiarCantidad(${index},1)">
                        +
                    </button>

                    <button
                    onclick="eliminarCarrito(${index})">
                        ×
                    </button>

                </div>

            `;


            contenedor.appendChild(
                item
            );

        }
    );


    document.getElementById(
        "carritoTotal"
    ).textContent =
        "Total: Bs " +
        total.toFixed(2);

}


/* =========================
   CAMBIAR CANTIDAD
========================= */

function cambiarCantidad(
    index,
    cambio
){

    carrito[index].cantidad +=
        cambio;


    if(
        carrito[index].cantidad <= 0
    ){

        carrito.splice(
            index,
            1
        );

    }


    actualizarCarrito();

}


/* =========================
   ELIMINAR
========================= */

function eliminarCarrito(index){

    carrito.splice(
        index,
        1
    );

    actualizarCarrito();

}


/* =========================
   ABRIR CARRITO
========================= */

function abrirCarrito(){

    mostrarCarrito();

    document.getElementById(
        "modalCarrito"
    ).style.display =
        "flex";

}


/* =========================
   CERRAR CARRITO
========================= */

function cerrarCarrito(){

    document.getElementById(
        "modalCarrito"
    ).style.display =
        "none";

}


/* =========================
   CONSULTAR PRODUCTO
========================= */

function consultarProducto(id){

    const producto =
        productos.find(
            p =>
            String(p.id) ===
            String(id)
        );


    if(!producto){

        return;

    }


    const mensaje =
        "Hola, quiero consultar por el producto:%0A%0A" +
        "Producto: " +
        encodeURIComponent(
            producto.nombre
        ) +
        "%0A" +
        "Precio: " +
        encodeURIComponent(
            producto.precio
        ) +
        "%0A%0A" +
        "GUILLTAC";


    window.open(
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        mensaje,
        "_blank"
    );

}


/* =========================
   CHECKOUT
========================= */

function abrirCheckout(){

    if(carrito.length === 0){

        alert(
            "El carrito está vacío."
        );

        return;

    }


    cerrarCarrito();


    document.getElementById(
        "modalCheckout"
    ).style.display =
        "flex";

}


/* =========================
   CERRAR CHECKOUT
========================= */

function cerrarCheckout(){

    document.getElementById(
        "modalCheckout"
    ).style.display =
        "none";

}


/* =========================
   ENVIAR PEDIDO
========================= */

function enviarPedido(){

    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    const apellido =
        document.getElementById(
            "apellido"
        ).value.trim();


    const telefono =
        document.getElementById(
            "telefono"
        ).value.trim();


    const ci =
        document.getElementById(
            "ci"
        ).value.trim();


    const ciudad =
        document.getElementById(
            "ciudad"
        ).value.trim();


    const direccion =
        document.getElementById(
            "direccion"
        ).value.trim();


    const entrega =
        document.getElementById(
            "entrega"
        ).value;


    const pago =
        document.getElementById(
            "pago"
        ).value;


    const observaciones =
        document.getElementById(
            "observaciones"
        ).value.trim();


    if(
        !nombre ||
        !apellido ||
        !telefono ||
        !ci
    ){

        alert(
            "Por favor completa los datos principales."
        );

        return;

    }


    let mensaje =
        "🛒 *PEDIDO GUILLTAC*%0A%0A";


    mensaje +=
        "*CLIENTE*%0A";

    mensaje +=
        "Nombre: " +
        encodeURIComponent(
            nombre +
            " " +
            apellido
        ) +
        "%0A";

    mensaje +=
        "Teléfono: " +
        encodeURIComponent(
            telefono
        ) +
        "%0A";

    mensaje +=
        "C.I.: " +
        encodeURIComponent(
            ci
        ) +
        "%0A";

    mensaje +=
        "Ciudad: " +
        encodeURIComponent(
            ciudad
        ) +
        "%0A";

    mensaje +=
        "Dirección: " +
        encodeURIComponent(
            direccion
        ) +
        "%0A%0A";


    mensaje +=
        "*PRODUCTOS*%0A";


    let total = 0;


    carrito.forEach(
        producto => {

            const precio =
                parseFloat(
                    producto.precio
                ) || 0;


            const subtotal =
                precio *
                producto.cantidad;


            total += subtotal;


            mensaje +=
                "- " +
                encodeURIComponent(
                    producto.nombre
                ) +
                " x" +
                producto.cantidad +
                " = Bs " +
                subtotal.toFixed(2) +
                "%0A";

        }
    );


    mensaje +=
        "%0A*TOTAL: Bs " +
        total.toFixed(2) +
        "*%0A%0A";


    mensaje +=
        "Entrega: " +
        encodeURIComponent(
            entrega
        ) +
        "%0A";


    mensaje +=
        "Pago: " +
        encodeURIComponent(
            pago
        ) +
        "%0A";


    mensaje +=
        "Observaciones: " +
        encodeURIComponent(
            observaciones ||
            "Ninguna"
        );


    window.open(
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        mensaje,
        "_blank"
    );

}


/* =========================
   INICIAR
========================= */

cargarProductos();

</script>
