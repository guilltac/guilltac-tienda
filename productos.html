<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GUILLTAC - Productos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    color:#ccc;
}

main{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}

.formulario{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h2{
    margin-top:0;
}

.grupo{
    margin-bottom:18px;
}

.grupo label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.categorias{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

.category-option{
    border:1px solid #ccc;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:normal !important;
}

.category-option input{
    width:auto;
    margin-right:8px;
}

button{
    width:100%;
    padding:14px;
    background:#111;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.volver{
    display:inline-block;
    margin-bottom:20px;
    color:#111;
    text-decoration:none;
    font-weight:bold;
}

.volver:hover{
    text-decoration:underline;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    background:#e8f5e9;
    color:#176b2c;
    text-align:center;
    font-weight:bold;
}

</style>

</head>


<body>


<header>

<h1>GUILLTAC</h1>

<p>Administración de productos</p>

</header>


<main>

<a
href="admin.html"
class="volver"
>
← Volver al panel
</a>


<section class="formulario">

<h2>Agregar producto</h2>


<div class="grupo">

<label for="nombre">
Nombre del producto
</label>

<input
type="text"
id="nombre"
placeholder="Ej. Bota Táctica Urbana"
>

</div>


<div class="grupo">

<label for="precio">
Precio (Bs)
</label>

<input
type="number"
id="precio"
min="0"
step="0.01"
placeholder="0"
>

</div>


<div class="grupo">

<label for="stock">
Stock
</label>

<input
type="number"
id="stock"
min="0"
placeholder="0"
>

</div>


<div class="grupo">

<label for="estado">
Estado
</label>

<select id="estado">

<option value="activo">
Activo
</option>

<option value="agotado">
Agotado
</option>

</select>

</div>


<div class="grupo">

<label for="descripcion">
Descripción
</label>

<textarea
id="descripcion"
placeholder="Descripción del producto..."
></textarea>

</div>


<div class="grupo">

<label>
Categorías
</label>


<div class="categorias">


<label class="category-option">

<input
type="checkbox"
value="novedades"
>

Novedades

</label>


<label class="category-option">

<input
type="checkbox"
value="botas"
>

Botas

</label>


<label class="category-option">

<input
type="checkbox"
value="tactico"
>

Equipo Táctico

</label>


<label class="category-option">

<input
type="checkbox"
value="uniformes"
>

Uniformes

</label>


<label class="category-option">

<input
type="checkbox"
value="aph"
>

APH

</label>


<label class="category-option">

<input
type="checkbox"
value="promo"
>

Promociones

</label>


<label class="category-option">

<input
type="checkbox"
value="usado"
>

Usados

</label>


</div>

</div>


<div class="grupo">

<label for="foto">
Fotografía del producto
</label>

<input
type="file"
id="foto"
accept="image/*"
>

</div>


<button
type="button"
onclick="guardarProducto()"
>

Guardar producto

</button>


<div
id="mensaje"
class="mensaje"
>
Producto enviado correctamente.
</div>


</section>


</main>


<script>


const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbzSN6dszANppWHxfySG_QEjW8n57qFFeBwcAfaW7tI2WeZPWArCGBqhWQp-mUv0EwU-uQ/exec";


function guardarProducto(){

    const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();

    const precio =
        document
        .getElementById("precio")
        .value;

    const stock =
        document
        .getElementById("stock")
        .value;

    const descripcion =
        document
        .getElementById("descripcion")
        .value
        .trim();

    const estado =
        document
        .getElementById("estado")
        .value;

    const categorias =
        Array.from(
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            )
        )
        .map(function(categoria){

            return categoria.value;

        })
        .join(",");


    if(
        nombre === "" ||
        precio === "" ||
        stock === ""
    ){

        alert(
            "Completa nombre, precio y stock."
        );

        return;

    }


    const datos = {

        id: Date.now(),

        nombre: nombre,

        precio: precio,

        stock: stock,

        descripcion: descripcion,

        categorias: categorias,

        estado: estado,

        foto: ""

    };


    const formulario =
        document.createElement("form");


    formulario.method =
        "POST";


    formulario.action =
        URL_SERVIDOR;


    formulario.target =
        "guilltac_envio";


    Object.keys(datos).forEach(
        function(campo){

            const input =
                document.createElement("input");

            input.type =
                "hidden";

            input.name =
                campo;

            input.value =
                datos[campo];

            formulario.appendChild(
                input
            );

        }
    );


    const iframe =
        document.createElement("iframe");


    iframe.name =
        "guilltac_envio";


    iframe.style.display =
        "none";


    document.body.appendChild(
        iframe
    );


    document.body.appendChild(
        formulario
    );


    formulario.submit();


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.innerHTML =
        "✅ PRODUCTO REGISTRADO CORRECTAMENTE<br><br>" +
        "📦 Producto: " +
        nombre +
        "<br>" +
        "💰 Precio: Bs " +
        precio +
        "<br>" +
        "📦 Stock: " +
        stock;


    mensaje.style.display =
        "block";


    document
    .getElementById("nombre")
    .value = "";

    document
    .getElementById("precio")
    .value = "";

    document
    .getElementById("stock")
    .value = "";

    document
    .getElementById("descripcion")
    .value = "";

    document
    .getElementById("estado")
    .value =
        "activo";


    document
    .getElementById("foto")
    .value = "";


    document
    .querySelectorAll(
        'input[type="checkbox"]'
    )
    .forEach(function(caja){

        caja.checked = false;

    });

}
    
</script>


</body>

</html>
